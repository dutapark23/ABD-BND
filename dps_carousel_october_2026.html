<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }
  .slide {
    width: 210mm;
    height: 210mm;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    page-break-after: always;
  }
  .slide:last-child { page-break-after: avoid; }
  .slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
</style>
</head>
<body>
  <div class="slide"><img src="carousel_cards/card1_hook.png"/></div>
  <div class="slide"><img src="carousel_cards/card2_hire_cost.png"/></div>
  <div class="slide"><img src="carousel_cards/card3_dps_cost.png"/></div>
  <div class="slide"><img src="carousel_cards/card4_comparison.png"/></div>
  <div class="slide"><img src="carousel_cards/card5_cta.png"/></div>
</body>
</html>
